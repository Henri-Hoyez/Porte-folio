server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/csv;

    location / {
        try_files $uri $uri/ =404;
    }

    # Relais de synchronisation de la page hydratation (SSE + PUT).
    # Hôte résolu à la demande via le DNS Docker : nginx démarre même si le
    # relais n'est pas encore prêt, et le reste du site ne dépend pas de lui.
    location ^~ /api/hydratation/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $hydratation_sync "http://hydratation-sync:3000";
        rewrite ^/api/hydratation/(.*)$ /$1 break;
        proxy_pass $hydratation_sync;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 8k;
    }

    location ~* \.csv$ {
        default_type text/csv;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /index.html;
}
