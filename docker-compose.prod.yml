# Production — https://www.henrihoyez.ovh
# `up -d` seul réutilise l'image locale `latest` déjà présente.
# Le workflow CI tire le tag du commit, le retague en `latest`, puis recrée les conteneurs.
services:
  website:
    image: henriho/portfolio-website:latest
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website

volumes:
  caddy_data:
  caddy_config:
