# Développement local — http://localhost:8080
services:
  website:
    build: .
    ports:
      - "0.0.0.0:8080:80"
    restart: unless-stopped
    depends_on:
      - hydratation-sync

  hydratation-sync:
    build: ./sync
    expose:
      - "3000"
    environment:
      TRUST_PROXY: "1"
    restart: unless-stopped
